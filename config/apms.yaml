substitutions:
  # package vars must override these invalid defaults
  i2c: null
  light: null
  display: null
  button: null
  motion: null
  display_size: null

  # region
  # substitutions that may be overridden on the esphome command line.
  # when overridden, the values will always be typed as strings
  # even though the same values parsed from yaml would be typed otherwise.
  # such string values are jinja-filtered to non-string types when needed.

  name: apms
  logger_level: INFO

  update_interval: 60

  rotation: 0

  barometric_pressure_psi: 14.696
  barometric_pressure_mbar: ${pressure.mbar.per_psi * (barometric_pressure_psi | float)}

  pressure_raw_psi_0: 1000
  pressure_raw_psi_100: 15000

  pressure_unit: psi

  pressure_psi_precision: 3
  pressure_psi_range_min: 0
  pressure_psi_range_max: 100
  pressure_psi_bound_min: 30
  pressure_psi_bound_max: 80

  pressure_mbar_precision: 1
  pressure_mbar_range_min: 0
  pressure_mbar_range_max: 7000
  pressure_mbar_bound_min: 2000
  pressure_mbar_bound_max: 5500

  temperature_unit: fahrenheit

  temperature_fahrenheit_precision: 2
  temperature_fahrenheit_range_min: 0
  temperature_fahrenheit_range_max: 120

  temperature_celsius_precision: 2
  temperature_celsius_range_min: -20
  temperature_celsius_range_max: 50

  molar_density_precision: 2
  molar_density_range_min: 0
  molar_density_range_max: 400

  smtp: true
  debug: false

  # endregion

  # region
  # substitutions that should not be overridden on the esphome command line.
  # these are derived from substitutions that may be overridden.

  pressure_precision: ${pressure[pressure.unit].precision}
  pressure_range_min: ${pressure[pressure.unit].range_min}
  pressure_range_max: ${pressure[pressure.unit].range_max}
  pressure_bound_min: ${pressure[pressure.unit].bound_min}
  pressure_bound_max: ${pressure[pressure.unit].bound_max}
  pressure_label_text: ${pressure[pressure.unit].label_text}

  pressure_format: "%.${pressure_precision}f"

  barometric_pressure_state: id(barometric_pressure_${pressure.unit}_).state

  pressure_state: id(pressure_${pressure.unit}_).state

  temperature_precision: ${temperature[temperature.unit].precision}
  temperature_range_min: ${temperature[temperature.unit].range_min}
  temperature_range_max: ${temperature[temperature.unit].range_max}

  temperature_format: "%.${temperature_precision}f"

  # endregion

  # region
  # substitutions that can not be overridden on the esphome command line.

  barometric_pressure:
    measurement_alarm: barometric_pressure_measurement_alarm_
    psi: ${(barometric_pressure_psi | float)}
    mbar: ${(barometric_pressure_mbar | float)}

  pressure:
    measurement_watchdog_interval: ${(update_interval | int) + 10}
    measurement_alarm: pressure_measurement_alarm_
    bounds_alarm: pressure_bounds_alarm_
    raw:
      psi_0: ${(pressure_raw_psi_0 | int)}
      psi_100: ${(pressure_raw_psi_100 | int)}
    unit: ${pressure_unit | lower}
    psi:
      precision: ${(pressure_psi_precision | int)}
      range_min: ${(pressure_psi_range_min | int)}
      range_max: ${(pressure_psi_range_max | int)}
      bound_min: ${(pressure_psi_bound_min | int)}
      bound_max: ${(pressure_psi_bound_max | int)}
      label_text: pressure_psi_label_text_
    mbar:
      precision: ${(pressure_mbar_precision | int)}
      range_min: ${(pressure_mbar_range_min | int)}
      range_max: ${(pressure_mbar_range_max | int)}
      bound_min: ${(pressure_mbar_bound_min | int)}
      bound_max: ${(pressure_mbar_bound_max | int)}
      label_text: pressure_bar_label_text_
      per_psi: 68.94757

  temperature:
    unit: ${temperature_unit | lower}
    fahrenheit:
      precision: ${(temperature_fahrenheit_precision | int)}
      range_min: ${(temperature_fahrenheit_range_min | int)}
      range_max: ${(temperature_fahrenheit_range_max | int)}
    celsius:
      precision: ${(temperature_celsius_precision | int)}
      range_min: ${(temperature_celsius_range_min | int)}
      range_max: ${(temperature_celsius_range_max | int)}

  molar_density:
    precision: ${(molar_density_precision | int)}
    range_min: ${(molar_density_range_min | int)}
    range_max: ${(molar_density_range_max | int)}
    format: "%.${molar_density_precision}f"

  pressure_unit_on_value:
    - if:
        condition:
          lambda: return x < ${pressure_bound_min};
        then:
          - logger.log:
              level: WARN
              format: "${name} pressure ${pressure_format} ${pressure.unit} < ${pressure_bound_min}"
              args: [x]
          - binary_sensor.template.publish:
              id: ${pressure.bounds_alarm}
              state: ON
        else:
          - if:
              condition:
                lambda: return x > ${pressure_bound_max};
              then:
                - logger.log:
                    level: WARN
                    format: "${name} pressure ${pressure_format} ${pressure.unit} > ${pressure_bound_max}"
                    args: [x]
                - binary_sensor.template.publish:
                    id: ${pressure.bounds_alarm}
                    state: ON
              else:
                - logger.log:
                    level: INFO
                    format: "${name} pressure ${pressure_format} ${pressure.unit}"
                    args: [x]
                - binary_sensor.template.publish:
                    id: ${pressure.bounds_alarm}
                    state: OFF
    - lvgl.indicator.update:
        id: pressure_indicator_
        value: !lambda return x * ${math.pow(10, pressure_precision)};
    - lvgl.widget.show: pressure_meter_
    - component.update: ${pressure_label_text}

  temperature_unit_on_value:
    - lvgl.indicator.update:
        id: temperature_indicator_
        value: !lambda return x * ${math.pow(10, ${temperature_precision})};
    - lvgl.widget.show: temperature_meter_
    - lvgl.label.update:
        id: temperature_label_
        text: !lambda return str_sprintf("${temperature_format}", x);
  
  apms_smtp: !include apms_smtp.yaml
  apms_debug: !include apms_debug.yaml

  # endregion
  
external_components:
  - source:
      type: local
      path: ../components
    components: [composition_, qmp6988]

packages:
  - ${apms_smtp if smtp in [true, 'true'] else {}}
  - ${apms_debug if debug in [true, 'true'] else {}}
  - !include ${name}_.yaml

logger:
  level: ${logger_level}

ota:
  - id: ota_
    platform: esphome
    password: !secret ota-password

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api-encryption-key

web_server:
  version: 3

globals:
  - id: button_held_
    type: bool
    initial_value: "false"
  - id: light_brightness_target_
    type: float
    initial_value: "1.0f"
    restore_value: yes

esphome:
  name: ${name}
  on_boot:
    - script.execute: pressure_measurement_watchdog_
    - script.execute: barometric_pressure_measurement_watchdog_

esp32:
  cpu_frequency: 80Mhz
  framework:
    sdkconfig_options:
      CONFIG_PARTITION_TABLE_OFFSET: "0xf000"
      CONFIG_SECURE_FLASH_ENC_ENABLED: "y"
      CONFIG_SECURE_FLASH_ENCRYPTION_AES256: "y"
      CONFIG_NVS_ENCRYPTION: "n"
      CONFIG_NVS_SEC_KEY_PROTECT_USING_FLASH_ENC: "n"
  partitions: partitions.csv

i2c:
  - id: !extend ${i2c}
    # replace internal pullups with external 4.7k pullups per TE M3200 datasheet
    # m5stack unit env iii (with qmp6988) has 4.7k pullups already
    scl_pullup_enabled: false
    sda_pullup_enabled: false

light:
  # a completed turn_on action to brightness 0 will turn the light off but with brightness 1
  - id: !extend ${light}
    restore_mode: RESTORE_DEFAULT_ON

display:
  - id: !extend ${display}
    auto_clear_enabled: false
    update_interval: never

interval:
  - interval: ${update_interval}s
    then:
      - lambda: id(molar_density_).consume(); // any stale values
      - component.update: tem3200_
      - delay: 1ms # yield
      - component.update: qmp6988_
      - if:
          condition:
            binary_sensor.is_on: ${barometric_pressure.measurement_alarm}
          then:
            lambda: id(molar_density_).curry(id(barometric_pressure_), ${barometric_pressure.mbar});

  - interval: 250ms
    then:
      - component.update: ${motion}
      - component.update: rotation_
      
script:
  - id: pressure_measurement_watchdog_
    mode: restart
    then:
      - delay: ${pressure.measurement_watchdog_interval}s
      - logger.log:
          level: ERROR
          format: "${name} pressure measurement failure (was ${pressure_format} ${pressure.unit})"
          args: ["${pressure_state}"]
      - binary_sensor.template.publish:
          id: ${pressure.measurement_alarm}
          state: ON
      - lvgl.widget.hide: pressure_meter_
      - lvgl.widget.hide: temperature_meter_
      - lvgl.widget.hide: molar_density_meter_

  - id: barometric_pressure_measurement_watchdog_
    mode: restart
    then:
      - delay: ${pressure.measurement_watchdog_interval}s
      - logger.log:
          level: ERROR
          format: "${name} barometric pressure measurement failure (was ${pressure_format} ${pressure.unit})"
          args: ["${barometric_pressure_state}"]
      - binary_sensor.template.publish:
          id: ${barometric_pressure.measurement_alarm}
          state: ON
      - lambda: id(molar_density_).curry(id(barometric_pressure_), ${barometric_pressure.mbar});

text_sensor:
  - id: pressure_psi_label_text_
    platform: template
    internal: true
    update_interval: never
    lambda: return str_sprintf("${pressure_format}", ${pressure_state});
    on_value:
      lvgl.label.update:
        id: pressure_label_
        text: !lambda return x;

  - id: pressure_bar_label_text_
    platform: template
    internal: true
    update_interval: never
    lambda: return str_sprintf("%.${pressure.mbar.precision + 3}f", ${pressure_state} / ${math.pow(10, 3)});
    on_value:
      lvgl.label.update:
        id: pressure_label_
        text: !lambda return x;

binary_sensor:
  - id: !extend ${button}
    on_press:
      - globals.set:
          id: button_held_
          value: "false"
      - delay: 300ms
      - if:
          condition:
            lambda: return id(${button}).state;
          then:
            - globals.set:
                id: button_held_
                value: "true"
            - light.turn_on:
                id: ${light}
                brightness: !lambda return id(light_brightness_target_);
                transition_length: !lambda |-
                  return static_cast<uint32_t>(2000.0f * (
                    std::abs(id(light_brightness_target_) - id(${light}).remote_values.get_brightness())));
    on_release:
      if:
        condition:
          lambda: return !id(button_held_);
        then:
          - if:
              condition:
                light.is_off: ${light}
              then:
                - light.turn_on:
                    id: ${light}
                    transition_length: 0ms
                    brightness: 1.0
                - globals.set:
                    id: light_brightness_target_
                    value: "0.0f"
          - lvgl.page.next:
        else:
          if:
            condition:
              light.is_off: ${light}
            then:
              globals.set:
                id: light_brightness_target_
                value: "1.0f"
            else:
              if:
                condition:
                  lambda: return 1.0f == id(${light}).current_values.get_brightness();
                then:
                  globals.set:
                    id: light_brightness_target_
                    value: "0.0f"
                else:
                  light.turn_on:
                    id: ${light}
                    transition_length: 0ms
                    brightness: !lambda return id(${light}).current_values.get_brightness();

  - id: ${pressure.bounds_alarm}
    name: pressure bounds alarm
    platform: template
    device_class: problem
    trigger_on_initial_state: true

  - id: ${pressure.measurement_alarm}
    name: pressure measurement alarm
    platform: template
    device_class: problem
    trigger_on_initial_state: true

  - id: ${barometric_pressure.measurement_alarm}
    name: barometric pressure measurement alarm
    platform: template
    device_class: problem
    trigger_on_initial_state: true

motion:
  - id: !extend ${motion}
    accelerometer_range: 2G
    accelerometer_odr: 100HZ  # 100HZ default, with hardware low pass filter
    update_interval: never  # 250ms default

sensor:
  - id: acceleration_x_
    name: acceleration x
    platform: motion
    motion_id: ${motion}
    type: acceleration_x
    internal: true

  - id: acceleration_y_
    name: acceleration y
    platform: motion
    motion_id: ${motion}
    type: acceleration_y
    internal: true

  - id: acceleration_z_
    name: acceleration z
    platform: motion
    motion_id: ${motion}
    type: acceleration_z
    internal: true

  - id: rotation_
    name: rotation
    platform: template
    lambda: |-
      auto constexpr tau{2.0f * std::numbers::pi_v<float>};
      auto constexpr pi_2{std::numbers::pi_v<float> / 2.0f};
      auto constexpr pi_4{std::numbers::pi_v<float> / 4.0f};
      auto const x{id(acceleration_x_).state};
      auto const y{id(acceleration_y_).state};
      auto const z{id(acceleration_z_).state};
      auto const ax{std::abs(x)};
      auto const ay{std::abs(y)};
      auto const az{std::abs(z)};
      if (az > ax && az > ay) return {};  // no change
      auto angle{std::atan2(y, x)};
      if (angle < 0) angle += tau;
      return 90.0f * (static_cast<unsigned>(std::floor((angle + pi_4) / pi_2)) % 4);
    filters:
      - delta: 0.0
    on_value:
      - logger.log:
          level: INFO
          format: "rotation %f"
          args: [x]
      # https://github.com/esphome/esphome/issues/17227
      # - lambda: |-
      #     id(lvgl_).set_rotation(static_cast<display::DisplayRotation>(static_cast<int>(x)));
  - id: tem3200_
    platform: tem3200
    i2c_id: ${i2c}
    update_interval: never

    raw_pressure:
      id: pressure_
      internal: true
      on_value:
        - script.execute: pressure_measurement_watchdog_
        - component.update: pressure_psi_
        - component.update: pressure_mbar_
        - binary_sensor.template.publish:
            id: ${pressure.measurement_alarm}
            state: OFF

    temperature:
      id: temperature_
      internal: true
      on_value:
        - component.update: temperature_celsius_
        - component.update: temperature_fahrenheit_

  - id: pressure_psi_
    name: pressure psi
    platform: template
    update_interval: never
    unit_of_measurement: psi
    state_class: measurement
    device_class: pressure
    accuracy_decimals: ${pressure.psi.precision}
    lambda: return id(pressure_).state;
    filters:
      calibrate_linear:
        - ${pressure.raw.psi_0} -> 0
        - ${pressure.raw.psi_100} -> 100
    on_value: ${pressure_unit_on_value if pressure.unit == "psi" else []}

  - id: pressure_mbar_
    name: pressure mbar
    platform: template
    update_interval: never
    unit_of_measurement: mbar
    state_class: measurement
    device_class: pressure
    accuracy_decimals: ${pressure.mbar.precision}
    lambda: return id(pressure_).state;
    filters:
      calibrate_linear:
        - ${pressure.raw.psi_0} -> 0
        - ${pressure.raw.psi_100} -> ${100 * pressure.mbar.per_psi}
    on_value:
      - then: ${pressure_unit_on_value if pressure.unit == "mbar" else []}
      - then:
        - lambda: id(molar_density_).curry(id(pressure_mbar_));

  - id: temperature_celsius_
    name: temperature celsius
    platform: template
    update_interval: never
    unit_of_measurement: °C
    state_class: measurement
    device_class: temperature
    accuracy_decimals: ${temperature.celsius.precision}
    lambda: return id(temperature_).state;
    on_value:
      - then: ${temperature_unit_on_value if temperature.unit == "celsius" else []}
      - then: 
        - lambda: id(molar_density_).curry(id(temperature_celsius_));

  - id: temperature_fahrenheit_
    name: temperature fahrenheit
    platform: template
    update_interval: never
    unit_of_measurement: °F
    state_class: measurement
    device_class: temperature
    accuracy_decimals: ${temperature.fahrenheit.precision}
    lambda: return id(temperature_).state;
    filters:
      calibrate_linear:
        - 0 -> 32
        - 100 -> 212
    on_value: ${temperature_unit_on_value if temperature.unit == "fahrenheit" else []}

  - id: qmp6988_
    platform: qmp6988
    i2c_id: ${i2c}
    update_interval: never
    pressure:
      id: barometric_pressure_
      internal: true
      # unit_of_measurement: hPa
      on_value:
        - script.execute: barometric_pressure_measurement_watchdog_
        - component.update: barometric_pressure_psi_
        - component.update: barometric_pressure_mbar_
        - binary_sensor.template.publish:
            id: ${barometric_pressure.measurement_alarm}
            state: OFF
        - lambda: id(molar_density_).curry(id(barometric_pressure_));

  - id: barometric_pressure_psi_
    name: barometric pressure psi
    platform: template
    update_interval: never
    unit_of_measurement: psi
    state_class: measurement
    device_class: pressure
    accuracy_decimals: ${pressure.psi.precision}
    lambda: return id(barometric_pressure_).state / ${pressure.mbar.per_psi};

  - id: barometric_pressure_mbar_
    name: barometric pressure mbar
    platform: template
    update_interval: never
    unit_of_measurement: mbar
    state_class: measurement
    device_class: pressure
    accuracy_decimals: ${pressure.mbar.precision}
    lambda: return id(barometric_pressure_).state;  // 1 hPa = 1 mbar

  - id: molar_density_
    name: molar density
    platform: composition_
    unit_of_measurement: mol/m³
    state_class: measurement
    device_class: ""
    accuracy_decimals: ${molar_density.precision}
    sensors:
      - pressure_mbar_
      - temperature_celsius_
      - barometric_pressure_
    lambda: |-
      // pV = nRT ⇒ n/V = p/(R·T)
      // p is absolute pressure (gauge + barometric) in Pa (kg/(m·s²), 100 Pa = 1 mbar)
      // V is volume in m³
      // n is moles in mol
      // R is ideal gas constant in kg·m²/(s²·mol·K) (8.31446)
      // T is absolute temperature in kelvin (273.15 K = 0 °C)
      auto constexpr pascal_per_mbar{100.0f};
      auto constexpr kelvin_offset_celsius{273.15f};
      auto constexpr R{8.31446f};
      auto const [gp, t, bp]{id(molar_density_).consume()};
      auto const p{pascal_per_mbar * (*gp + *bp)};
      auto const T{kelvin_offset_celsius + *t};
      return p / (R * T);	// = n / V
    on_value:
      - logger.log:
          level: INFO
          format: "${name} molar_density ${molar_density.format} mol/m³"
          args: [x]
      - lvgl.indicator.update:
          id: molar_density_indicator_
          value: !lambda return x * ${math.pow(10, molar_density.precision)};
      - lvgl.widget.show: molar_density_meter_
      - lvgl.label.update:
          id: molar_density_label_
          text: !lambda return str_sprintf("${molar_density.format}", x);

  - id: sht3xd_
    platform: sht3xd
    i2c_id: ${i2c}
    humidity:
      id: humidity_
      name: humidity

image:
  - id: apms_
    file: apms.png
    type: rgb565
    resize: ${display_size}
  - id: pressure_scale_
    file: scale_${pressure.unit}.png
    type: rgb565
    resize: ${display_size}
    transparency: alpha_channel
  - id: temperature_scale_
    file: scale_${temperature.unit}.png
    type: rgb565
    resize: ${display_size}
    transparency: alpha_channel
  - id: molar_density_scale_
    file: scale_molar_density.png
    type: rgb565
    resize: ${display_size}
    transparency: alpha_channel

lvgl:
  id: lvgl_
  rotation: ${rotation}
  pages:
    - widgets:
        - image:
            src: apms_
            align: CENTER
            on_boot:
              - delay: 4s
              - lvgl.page.next:
    - widgets:
        - container:
            widgets:
              - obj:
                  bg_color: black
                  width: 100%
                  height: 100%
                  border_width: 0
                  radius: 0
              - meter:
                  bg_opa: TRANSP
                  width: 100%
                  height: 100%
                  scales:
                    - range_from: ${pressure_range_min}
                      range_to: ${pressure_range_max}
                      indicators:
                        - arc:
                            color: red
                            width: 8
                            start_value: ${pressure_range_min}
                            end_value: ${pressure_bound_min}
                        - arc:
                            color: green
                            width: 8
                            start_value: ${pressure_bound_min}
                            end_value: ${pressure_bound_max}
                        - arc:
                            color: red
                            width: 8
                            start_value: ${pressure_bound_max}
                            end_value: ${pressure_range_max}
              - image:
                  src: pressure_scale_
                  align: CENTER
              - meter:
                  id: pressure_meter_
                  bg_opa: TRANSP
                  width: 100%
                  height: 100%
                  hidden: true
                  scales:
                    - range_from: ${math.pow(10, pressure_precision) * pressure_range_min}
                      range_to: ${math.pow(10, pressure_precision) * pressure_range_max}
                      indicators:
                        - line:
                            id: pressure_indicator_
                            color: red
              - label:
                  id: pressure_label_
                  align: CENTER
                  text_color: white
                  y: 45
                  text: "---"
    - widgets:
        - container:
            widgets:
              - obj:
                  bg_color: black
                  width: 100%
                  height: 100%
                  border_width: 0
                  radius: 0
              - image:
                  src: temperature_scale_
                  align: CENTER
              - meter:
                  id: temperature_meter_
                  bg_opa: TRANSP
                  width: 100%
                  height: 100%
                  hidden: true
                  scales:
                    - range_from: ${math.pow(10, temperature_precision) * temperature_range_min}
                      range_to: ${math.pow(10, temperature_precision) * temperature_range_max}
                      indicators:
                        - line:
                            id: temperature_indicator_
                            color: red
              - label:
                  id: temperature_label_
                  align: CENTER
                  text_color: white
                  y: 45
                  text: "--"
    - widgets:
        - container:
            widgets:
              - obj:
                  bg_color: black
                  width: 100%
                  height: 100%
                  border_width: 0
                  radius: 0
              - image:
                  src: molar_density_scale_
                  align: CENTER
              - meter:
                  id: molar_density_meter_
                  bg_opa: TRANSP
                  width: 100%
                  height: 100%
                  hidden: true
                  scales:
                    - range_from: ${math.pow(10, molar_density.precision) * molar_density.range_min}
                      range_to: ${math.pow(10, molar_density.precision) * molar_density.range_max}
                      indicators:
                        - line:
                            id: molar_density_indicator_
                            color: red
              - label:
                  id: molar_density_label_
                  align: CENTER
                  text_color: white
                  y: 45
                  text: "--"
