substitutions:
  # package vars must override these invalid defaults ...
  spi_interface: null
  spi: null
  lp5562: null
  output: null
  i2c: null
  i2c_grove: null
  light: null
  display: null
  button: null
  motion: null
  # ... except if i2c_grove is not overridden
  # the m5stack_atoms3r.gpio.grove pins can be used for something else

  m5stack_atoms3r:
    display:
      width: 128
      height: 128
      size: "128x128"
    gpio:
      button: GPIO41
      i2c:
        scl: GPIO0
        sda: GPIO45
      grove:
        - GPIO1
        - GPIO2
      spi:
        clk: GPIO15
        mosi: GPIO21
      ir: GPIO47
      display:
        dc: GPIO42
        reset: GPIO48
        cs: GPIO14
    atom_bus:
      - - GPIO39
        - GPIO38
      - - null
        - GPIO5
        - GPIO6
        - GPIO7
        - GPIO8

external_components: 
  - source: github://m5stack/esphome-yaml/components@main
    components: [lp5562]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz

binary_sensor:
  - id: ${button}
    platform: gpio
    pin:
      number: ${m5stack_atoms3r.gpio.button}
      mode: INPUT_PULLUP
      inverted: true
    internal: true

i2c:
  - id: ${i2c}
    scl:
      number: ${m5stack_atoms3r.gpio.i2c.scl}
      ignore_strapping_warning: true
    sda:
      number: ${m5stack_atoms3r.gpio.i2c.sda}
      ignore_strapping_warning: true
    scan: true

  - |-
    ${{
      "id": i2c_grove,
      "scl": m5stack_atoms3r.gpio.grove[0],
      "sda": m5stack_atoms3r.gpio.grove[1],
      "scan": true
    } if i2c_grove is not none else None}

lp5562:
  id: ${lp5562}
  i2c_id: ${i2c}
  use_internal_clk: true
  high_pwm_freq: true
  logarithmic_dimming: true
  white_current: 17.5

output:
  - id: ${output}
    platform: lp5562
    lp5562_id: ${lp5562}
    channel: white

light:
  - id: ${light}
    platform: monochromatic
    output: ${output}

spi:
  id: ${spi}
  interface: ${spi_interface}
  clk_pin: ${m5stack_atoms3r.gpio.spi.clk}
  mosi_pin: ${m5stack_atoms3r.gpio.spi.mosi}

display:
  - id: ${display}
    platform: mipi_spi
    model: ST7789V
    dc_pin: ${m5stack_atoms3r.gpio.display.dc}
    reset_pin: ${m5stack_atoms3r.gpio.display.reset}
    cs_pin: ${m5stack_atoms3r.gpio.display.cs}
    data_rate: 40MHz
    dimensions:
      width: ${m5stack_atoms3r.display.width}
      height: ${m5stack_atoms3r.display.height}
      offset_height: 1
      offset_width: 2
      pad_height: 1
      pad_width: 2
    invert_colors: true

motion:
  - id: ${motion}
    platform: bmi270
    i2c_id: ${i2c}
    axis_map:
      x: x
      y: "-y"
      z: z

